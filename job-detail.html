<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求人詳細 | Sewa-Katsu</title>
    <meta name="description" content="Sewa-Katsuのプレミアム求人詳細ページです。">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Outfit:wght@400;600;800;900&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=2.1">
</head>

<body>
    <!-- Dynamic Background Elements -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- Header / Nav -->
    <header class="glass-header scrolled">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <img src="assets/images/sewa_logo.png" alt="Sewa-Katsu Logo"
                    style="height: 36px; width: auto; object-fit: contain;">
            </a>
            <nav class="main-nav">
                <a href="index.html#jobs" class="btn btn-secondary btn-sm">← 求人一覧へ戻る</a>
            </nav>
        </div>
    </header>

    <main style="padding-top: 100px;">
        <!-- Job Details Section (Dynamic) -->
        <section id="job-detail-section" class="section view-section is-visible">
            <div class="container">
                <div id="job-detail-content">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>求人情報を読み込んでいます...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Registration Form Section -->
        <section id="apply-form" class="view-section section is-visible" style="padding-top: 0;">
            <div class="container">
                <!-- SewaKatsu Portable Embed Code -->
                <style>
                    .sewakatsu-form-wrapper {
                        background: #ffffff;
                        padding: 24px;
                        border-radius: 24px;
                        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
                        max-width: 800px;
                        margin: 40px auto;
                        width: 100%;
                        position: relative;
                        box-sizing: border-box;
                        font-family: sans-serif;
                    }

                    @media (max-width: 600px) {
                        .sewakatsu-form-wrapper {
                            padding: 16px;
                            border-radius: 16px;
                            margin: 20px auto;
                        }
                    }
                </style>
                <div class="sewakatsu-form-wrapper">
                    <div id="sewa-embed-container" style="width: 100%; min-width: 320px;">
                        <iframe src="https://sewa-katsu-crm-staging.web.app/entry/embed?source=YOUR_SOURCE_HERE"
                            id="sewa-embed-frame" width="100%" style="border: none; min-height: 600px; display: block;"
                            scrolling="no" title="SewaKatsu Registration Form"></iframe>
                    </div>
                </div>
                <script>
                    (function () {
                        var iframe = document.getElementById('sewa-embed-frame');
                        if (iframe) {
                            var currentUrl = iframe.src;
                            var separator = currentUrl.indexOf('?') > -1 ? '&' : '?';
                            iframe.src = currentUrl + separator + 'inflow_url=' + encodeURIComponent(window.location.href);
                        }
                        window.addEventListener('message', function (e) {
                            if (e.data.type === 'SEWA_EMBED_RESIZE') {
                                var iframe = document.getElementById('sewa-embed-frame');
                                if (iframe) {
                                    var newHeight = parseInt(e.data.height);
                                    if (!isNaN(newHeight)) {
                                        iframe.style.height = newHeight + 'px';
                                    }
                                }
                            }
                        });
                    })();
                </script>
                <!-- End Embed Code -->
            </div>
        </section>
    </main>

    <!-- Sticky Bottom CTA (Mobile/Desktop) -->
    <div id="sticky-cta" class="sticky-cta glass-panel hidden-cta">
        <div class="container sticky-cta-container">
            <div class="sticky-info">
                <p class="sticky-title" id="sticky-job-title">求人を読み込み中...</p>
                <p class="sticky-salary" id="sticky-job-salary">-</p>
                <button class="btn" id="sticky-apply-btn">
                    今すぐ応募する
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-left: 0.25rem;">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-container">
            <div class="footer-brand">
                <a href="index.html" class="logo">
                    <img src="assets/images/sewa_logo.png" alt="Sewa-Katsu Logo"
                        style="height: 36px; width: auto; object-fit: contain;">
                </a>
                <p class="footer-desc">外国人材のための次世代求人プラットフォーム</p>
                <p class="footer-desc" style="font-size: 0.85rem; margin-top: 1rem;">事業者：株式会社Helte（許可番号：12-ユ-300978）
                </p>
            </div>

            <div class="footer-links">
                <div class="link-col">
                    <h4>About</h4>
                    <ul>
                        <li><a href="https://helte.jp/" target="_blank" rel="noopener noreferrer">運営会社 (Helte)</a>
                        </li>
                    </ul>
                </div>
                <div class="link-col">
                    <h4>Legal</h4>
                    <ul>
                        <li><a href="https://sewa-katsu.helte.jp/ja/terms/" target="_blank"
                                rel="noopener noreferrer">利用規約</a></li>
                        <li><a href="https://sailjp.helte.jp/privacy/" target="_blank"
                                rel="noopener noreferrer">プライバシーポリシー</a></li>
                        <li><a href="https://sailjp.helte.jp/privacy/" target="_blank"
                                rel="noopener noreferrer">クッキーポリシー</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Helte Corporation. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/job-detail.js?v=2.1"></script>
</body>

</html>
