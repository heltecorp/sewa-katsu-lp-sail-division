<body>

    <main style="padding-top: 100px;">
        <!-- Job Details Section (Dynamic) -->
        <section id="job-detail-section" class="section view-section is-visible">
            <div class="container">

                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>求人情報を読み込んでいます...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Registration Form Section -->
        <section id="apply-form" class="view-section section is-visible" style="padding-top: 0;">
            <div class="container">
                <!-- SewaKatsu Portable Embed Code -->
                <!-- Copy and paste this code block into the HTML of any website -->
                <style>
                    .sewakatsu-form-wrapper {
                        background: #ffffff;
                        padding: 24px;
                        border-radius: 24px;
                        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
                        max-width: 800px;
                        margin: 40px auto;
                        width: 100%;
                        position: relative;
                        box-sizing: border-box;
                        font-family: sans-serif;
                    }
                    @media (max-width: 600px) {
                        .sewakatsu-form-wrapper {
                            padding: 16px;
                            border-radius: 16px;
                            margin: 20px auto;
                        }
                    }
                </style>
                <div class="sewakatsu-form-wrapper">
                    <div id="sewa-embed-container" style="width: 100%; min-width: 320px;">
                        <iframe src="https://sewa-katsu-crm.web.app/entry/embed?source=SEWA_JOB_OPENINGS_WEB" id="sewa-embed-frame"
                            width="100%" style="border: none; min-height: 600px; display: block;" scrolling="no"
                            title="SewaKatsu Registration Form"></iframe>
                    </div>
                </div>
                <script>
                    (function () {
                        // Append parent page URL and Job ID to iframe src
                        var iframe = document.getElementById('sewa-embed-frame');
                        if (iframe) {
                            var currentUrl = iframe.src;
                            var separator = currentUrl.indexOf('?') > -1 ? '&' : '?';
                            var urlParams = new URLSearchParams(window.location.search);
                            var jobId = urlParams.get('jobId') || urlParams.get('job_id') || urlParams.get('id');
                            var jobIdParam = jobId ? '&jobId=' + encodeURIComponent(jobId) : '';
                            iframe.src = currentUrl + separator + 'inflow_url=' + encodeURIComponent(window.location.href) + jobIdParam;
                        }
                        // Iframe message listener
                        window.addEventListener('message', function (e) {
                            if (!e.data) return;
                            // Auto-resize iframe height
                            if (e.data.type === 'SEWA_EMBED_RESIZE') {
                                var iframe = document.getElementById('sewa-embed-frame');
                                if (iframe) {
                                    var newHeight = parseInt(e.data.height);
                                    if (!isNaN(newHeight)) {
                                        iframe.style.height = newHeight + 'px';
                                    }
                                }
                            }
                            // Auto-scroll to top on step change
                            if (e.data.type === 'SEWA_EMBED_SCROLL_TOP') {
                                var iframe = document.getElementById('sewa-embed-frame');
                                if (iframe) {
                                    var offset = e.data.offset || 0;
                                    var iframeRect = iframe.getBoundingClientRect();
                                    var targetY = iframeRect.top + window.scrollY + offset;
                                    window.scrollTo({ top: targetY, behavior: 'smooth' });
                                }
                            }
                            // Form submission complete -> redirect to Thanks page
                            if (e.data.type === 'sewakatsu-form-submitted') {
                                var thanksType = e.data.thanksType; // 'interview' or 'complete'
                                window.location.href = '/thanks/' + thanksType;
                            }
                        });
                    })();
                </script>
                <!-- End Embed Code -->
            </div>
        </section>
    </main>

    <!-- Sticky Bottom CTA (Mobile/Desktop) -->
    <div id="sticky-cta" class="sticky-cta glass-panel hidden-cta">

                    今すぐ応募する
